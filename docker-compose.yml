# spall: taphttp captures traffic, spall shows it live in a browser.
#
#   client --(proxy 127.0.0.1:8080)--> taphttp --> internet
#                                         | lever API :8081 (compose network only)
#                                         | token on volume "taphttp-token"
#                                       spall --> http://127.0.0.1:3000
#
# Published ports are 127.0.0.1 only. The console shows raw traffic,
# including credentials, and has no auth. Do not change that. The lever
# API port (8081) is never published: only spall reaches it.
#
# Volumes:
#   taphttp-ca     CA cert and key. taphttp only; never mount it elsewhere.
#   traffic        taphttp's traffic.jsonl and traffic.db. taphttp only.
#   taphttp-token  Lever API token. Read-only in spall.
#   spall-data     spall's audit log of replay attempts. spall only.
#
# Replay is denied until you set an engagement scope, e.g. in .env:
#   SPALL_SCOPE=app.example.test,*.api.example.test

services:
  taphttp:
    # Published by taphttp's release workflow. Keep in step with the
    # taphttp-types tag in Cargo.toml. amd64 only for now.
    image: ghcr.io/cschooley/taphttp:0.6.1
    command:
      - start
      - --listen
      - 0.0.0.0:8080
      - --log-file
      - /data/traffic.jsonl
      - --api-listen
      - 0.0.0.0:8081
      # 0.0.0.0 is needed inside the container. Both are safe only because
      # 8080 is published on 127.0.0.1 and 8081 is never published.
      - --allow-open-proxy
      - --api-allow-plaintext
    environment:
      RUST_LOG: info
    ports:
      - "127.0.0.1:${TAPHTTP_PORT:-8080}:8080"
    volumes:
      - traffic:/data
      - taphttp-ca:/ca
      - taphttp-token:/token
    restart: unless-stopped

  spall:
    build: .
    depends_on:
      - taphttp
    environment:
      SPALL_LISTEN: 0.0.0.0:3000
      SPALL_TAPHTTP_API: http://taphttp:8081
      SPALL_TAPHTTP_TOKEN_FILE: /token/api-token
      # Shown in the status bar; keep in step with taphttp's published port.
      SPALL_PROXY_ADDRESS: 127.0.0.1:${TAPHTTP_PORT:-8080}
      # Hosts replay may send to (exact, *.wildcard, IP, CIDR). Empty: none.
      SPALL_SCOPE: ${SPALL_SCOPE:-}
      RUST_LOG: info
    ports:
      - "127.0.0.1:${SPALL_PORT:-3000}:3000"
    volumes:
      - taphttp-token:/token:ro
      - spall-data:/data
    restart: unless-stopped

volumes:
  traffic:
  taphttp-ca:
  taphttp-token:
  spall-data:
