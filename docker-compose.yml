# spall: taphttp captures traffic, spall shows it live in a browser.
#
#   client --(proxy 127.0.0.1:8080)--> taphttp --> internet
#                                         | lever API :8081 (compose network only)
#                                         | token on volume "taphttp-token"
#                                       spall --> http://127.0.0.1:3000
#
# Published ports are 127.0.0.1 only. The console shows raw traffic,
# including credentials, and has no auth. Do not change that. The lever
# API port (8081) is never published: only spall reaches it.
#
# Volumes:
#   taphttp-ca     CA cert and key. taphttp only; never mount it elsewhere.
#   traffic        taphttp's traffic.jsonl and traffic.db. taphttp only.
#   taphttp-token  Lever API token. Read-only in spall.
#   spall-data     spall's audit log of replay attempts. spall only.
#
# Replay is denied until you set an engagement scope, e.g. in .env:
#   SPALL_SCOPE=app.example.test,*.api.example.test

services:
  taphttp:
    # Published by taphttp's release workflow. Keep in step with the
    # taphttp-types tag in Cargo.toml. amd64 only for now.
    image: ghcr.io/cschooley/taphttp:0.9.0
    command:
      - start
      - --listen
      - 0.0.0.0:8080
      - --log-file
      - /data/traffic.jsonl
      - --api-listen
      - 0.0.0.0:8081
      # 0.0.0.0 is needed inside the container. Both are safe only because
      # 8080 is published on 127.0.0.1 and 8081 is never published.
      - --allow-open-proxy
      - --api-allow-plaintext
    environment:
      RUST_LOG: info
      # The agent sandbox's credential-only listener (spall#13 slice 2), once
      # taphttp has it (taphttp#27), on the sandbox network only:
      # - --auth-listen
      # - 0.0.0.0:8090
    ports:
      - "127.0.0.1:${TAPHTTP_PORT:-8080}:8080"
    volumes:
      - traffic:/data
      - taphttp-ca:/ca
      - taphttp-token:/token
    # `sandbox` is spall's agent sandboxes' only way out (#13): internal (no
    # route anywhere), with taphttp as its only other member.
    networks: [default, sandbox]
    restart: unless-stopped

  spall:
    build: .
    depends_on:
      - taphttp
    environment:
      SPALL_LISTEN: 0.0.0.0:3000
      SPALL_TAPHTTP_API: http://taphttp:8081
      SPALL_TAPHTTP_TOKEN_FILE: /token/api-token
      # Shown in the status bar; keep in step with taphttp's published port.
      SPALL_PROXY_ADDRESS: 127.0.0.1:${TAPHTTP_PORT:-8080}
      # spall's own published address: agents may never target it (#73).
      SPALL_SELF_ADDRESS: 127.0.0.1:${SPALL_PORT:-3000}
      # Hosts replay may send to (exact, *.wildcard, IP, CIDR). Empty: none.
      SPALL_SCOPE: ${SPALL_SCOPE:-}
      # spall as agent host (#63), off unless set in your shell. Left
      # blank, each is passed through only when set: e.g.
      #   SPALL_MODEL_PROVIDER=anthropic SPALL_MODEL_KEY=sk-ant-... docker compose up -d
      #   SPALL_MODEL_PROVIDER=openai SPALL_MODEL=qwen3 \
      #     SPALL_MODEL_URL=http://host.docker.internal:11434/v1 docker compose up -d
      # The key in the environment shows in `docker inspect`; a 0600 key
      # file mounted read-only (SPALL_MODEL_KEY_FILE) keeps it out of there.
      SPALL_MODEL_PROVIDER:
      SPALL_MODEL:
      SPALL_MODEL_URL:
      SPALL_MODEL_KEY:
      SPALL_MODEL_KEY_FILE:
      # Out-of-band callbacks (#1), off unless set (see .env.example). With
      # the `oob` profile: SPALL_OAST_SERVER=http://interactsh,
      # SPALL_OAST_DOMAIN=oast.lab, SPALL_OAST_HTTP=http://interactsh.
      SPALL_OAST_SERVER:
      SPALL_OAST_DOMAIN:
      SPALL_OAST_HTTP:
      SPALL_OAST_TOKEN:
      SPALL_OAST_TOKEN_FILE:
      RUST_LOG: info
    # A local model on this machine (Ollama, llama.cpp) at host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${SPALL_PORT:-3000}:3000"
    volumes:
      - taphttp-token:/token:ro
      - spall-data:/data
    restart: unless-stopped

  # Out-of-band callbacks in a lab (#1): `docker compose --profile oob up -d`.
  # A self-hosted interactsh server on the compose network only (nothing
  # published): lab targets reach it as http://interactsh/<payload id>, or
  # by DNS if their resolver is pointed at it. For targets on the internet,
  # run it on a VPS with a delegated subdomain instead (README). Never the
  # public oast.* servers: callbacks can carry client data.
  interactsh:
    profiles: ["oob"]
    image: projectdiscovery/interactsh-server:v1.2.4@sha256:ffde50de2cdc9113b9bb024d9dbe63a7a4826de213be1cc63a7ffd5fd3b14481
    command:
      - -domain
      - ${SPALL_OAST_DOMAIN:-oast.lab}
      # The address its DNS answers with; a lab has no public one.
      - -ip
      - ${SPALL_OAST_IP:-127.0.0.1}
      - -token
      - ${SPALL_OAST_TOKEN:-}
      # No certificates in a lab; the id is found anywhere in a request.
      - -skip-acme
      - -scan-everywhere
      - -disable-update-check
      - -disable-version
      - -eviction
      - "7"
    restart: unless-stopped

  # A hackable target (OWASP Juice Shop, MIT): `docker compose --profile lab
  # up -d`. Nothing is published: browse it through the proxy as
  # http://juice.lab:3000, so every request is captured, and scope your
  # engagement to juice.lab. It's deliberately vulnerable: keep it on the
  # compose network. Its SSRF (profile image from URL) can reach the `oob`
  # profile's interactsh at http://interactsh/<payload id>. Pinned by digest;
  # it is a dev and demo target, not the academy's (M9).
  juice-shop:
    profiles: ["lab"]
    image: bkimminich/juice-shop:v20.4.0@sha256:9bbaecc41791f00b002bc65931cc5ff355fbdb941fa72b06558c18dace43197b
    networks:
      default:
        aliases: ["juice.lab"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    restart: unless-stopped

networks:
  default: {}
  # Agent sandboxes (spall#13, docs/sandbox.md slice 2) join this and reach
  # only taphttp's credential-only listener. spall checks it with a probe
  # sandbox before routing anything: internal, the open listener (8080)
  # unreachable from here, the credential-only one asking for a credential.
  sandbox:
    name: spall-sandbox
    internal: true

volumes:
  traffic:
  taphttp-ca:
  taphttp-token:
  spall-data:
