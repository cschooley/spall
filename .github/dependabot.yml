# Dependency updates. cooldown: 14 days matches spall's rule that new
# versions are at least two weeks old before we take them (see CLAUDE.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # taphttp-types moves in step with the taphttp image in
      # docker-compose.yml; bump both by hand.
      - dependency-name: taphttp-types

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
