# Dependency updates. cooldown: 14 days matches spall's rule that new
# versions are at least two weeks old before we take them (see CLAUDE.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # taphttp-types moves in step with the taphttp image in
      # docker-compose.yml; bump both by hand.
      - dependency-name: taphttp-types

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Tracks the Node major in ui/.nvmrc and the Dockerfile; bump together.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint supports TypeScript < 6.1; move when it does.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    ignore:
      # Toolchains are bumped deliberately, in step with CI's RUST_TOOLCHAIN
      # and ui/.nvmrc.
      - dependency-name: rust
      - dependency-name: node
