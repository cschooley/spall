[package]
name = "spall"
version = "0.2.0"
edition = "2021"
description = "Assessment workbench for interactive and agentic web app testing"
license = "MIT"
publish = false

[[bin]]
name = "spall"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
futures-util = { version = "0.3", default-features = false }
# Plain-HTTP client for taphttp's lever API (compose network, no TLS).
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Traffic log schema, owned by taphttp. Bump the tag deliberately.
taphttp-types = { git = "https://github.com/cschooley/taphttp", tag = "v0.3.0" }
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
serde_urlencoded = "0.7"
# Embeds ui/dist (the built SPA). Debug builds read it from disk.
rust-embed = "8.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["io-util"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
